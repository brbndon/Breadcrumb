name: Breadcrumb
options:
  bundleIdPrefix: com.branalytic
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Breadcrumb:
    type: application
    platform: macOS
    sources: [Breadcrumb]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.branalytic.Breadcrumb
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Breadcrumb
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Breadcrumb/Breadcrumb.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Breadcrumb reads only the foreground website host in browsers you enable in Settings. Full URLs and titles are never stored.
  BreadcrumbTests:
    type: bundle.unit-test
    platform: macOS
    sources: [BreadcrumbTests]
    dependencies:
      - target: Breadcrumb
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.branalytic.BreadcrumbTests

schemes:
  Breadcrumb:
    build:
      targets:
        Breadcrumb: all
        BreadcrumbTests: [test]
    test:
      gatherCoverageData: true
      environmentVariables:
        BREADCRUMB_TESTING: "1"
      targets:
        - BreadcrumbTests
